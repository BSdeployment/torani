title: "אבן שלמה מאמרי תורה"
description: "אבן שלמה - מאמרי תורה מקיפים, מדיה וקבצים לעילוי נשמת שלמה בן חסיבה"

url: "https://bsdeployment.github.io"
baseurl: "/torani"

lang: he
direction: rtl

paginate: 15
paginate_path: "/articles/page:num/"

collections:
  books:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post

markdown: kramdown

kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed



exclude:
  - README.md
  - Gemfile
  - Gemfile.lock