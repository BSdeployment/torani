<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }} – {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="{{ '/assets/icons/app_install_icon192.png' | relative_url }}">


  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
  {% seo %}

  <meta name="google-site-verification" content="BDqILt9yjQH8JkhxxE_Fal84Crogj00kZSlPwbBX4gA" />
</head>
<body>
  {% include header.html %}
  <main class="site-main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
  window.BASEURL = "{{ site.baseurl }}";
 </script>
  {% if page.search %}
 
  <script src="{{ '/assets/js/search.js' | relative_url }}"></script>
  {% endif %}

</body>
</html>
