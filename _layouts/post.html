---
layout: default
---
<article class="post-full">
  <header class="post-full__header">
    <h1>{{ page.title }}</h1>


    <!-- <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time> -->
  
    <div class="hebrew-date" data-date="{{ page.date | date: '%Y-%m-%d' }}"></div>




    {% if page.tags.size > 0 %}
    <div class="post-full__tags">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}

    {% if page.pdf_link %}
    <div style="margin-top: 20px;font-weight: bold;">
      להורדה וצפייה בפורמט PDF <a target="_blank" href="{{page.pdf_link}}">לחץ כאן</a>
    </div>
    {% endif %}
  </header>
  <div class="post-full__body prose post-content-font">
    {{ content }}
  </div>
</article>

<script src="{{ '/assets/js/hebrew_date_core.js' | relative_url }}"></script>
<script>
  document.querySelectorAll('.hebrew-date').forEach(function (el) {
    try {
      el.textContent = HebrewDate.toHebrewDateString(el.dataset.date);
    } catch (e) {
      console.error(e);
    }
  });
</script>
